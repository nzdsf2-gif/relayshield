name: Data At Rest Check

# WHY THIS EXISTS
# ---------------
# Well-Architected SEC 8, "Automate data at rest protection". Encryption and public-access settings are
# configuration, and configuration drifts: a bucket created by hand next month has neither. This job reads
# every S3 bucket, SQS queue and DynamoDB table weekly and goes RED if any is unencrypted, publicly reachable
# without being listed as intentionally public, or missing recovery protection.
#
# It is DETECTION, run automatically. It changes nothing: the fixes run on the Mac, dry run first
# (AWS_PROFILE=relayshield python3 tools/wafr_data_at_rest.py). Say that in the WAFR Note rather than
# calling it automated remediation.
#
# A red run is the signal. If the role cannot read, the run is also red (AccessDenied is "blocked"), because a
# check that cannot see must never report clean. The read grant is tools/apply_data_at_rest_read_policy.sh.

on:
  schedule:
    - cron: '17 14 * * 1'   # Mondays, 14:17 UTC
  workflow_dispatch:

jobs:
  check:
    name: Audit data at rest
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::239677749008:role/relayshield-github-deploy
          aws-region: us-east-1

      - name: Install boto3
        run: pip install boto3

      - name: Check
        run: python3 tools/wafr_data_at_rest.py --check
