name: Deploy Changed Lambdas to AWS

on:
  push:
    branches: [main]
    paths:
      - 'relayshield_breach_monitor.py'
      - 'relayshield_whatsapp_webhook.py'
      - 'relayshield_stripe_webhook.py'
      - 'relayshield_domain_monitor.py'
      - 'relayshield_sim_swap_monitor.py'
      - 'relayshield_api.py'
      # Shared modules. These are not handlers, but handlers import them, so a
      # change to one must redeploy every package that pulls it in. The job
      # resolves that by walking imports; these entries just make the push
      # actually trigger the workflow.
      - 'relayshield_openapi_spec.py'
      # Recovered from the live package on 2026-08-23: it was deployed by hand
      # and had never been in the repo, so nothing here listed it and no deploy
      # could ever have shipped a change to it. relayshield_api.py imports it,
      # so the job's import walk maps it to relayshield-api on its own -- this
      # entry only exists so a change to it triggers the workflow at all.
      - 'relayshield_sim_swap_consent.py'
      - 'relayshield_siem_connector.py'
      - 'relayshield_digest_sender.py'
      - 'relayshield_day3_sender.py'
      - 'relayshield_oauth_watchlist_monitor.py'
      - 'relayshield_monthly_oauth_reminder.py'
      - 'relayshield_quarterly_sweep_sender.py'
      - 'relayshield_sms_fallback_sender.py'
      - 'relayshield_telegram_webhook.py'
      - 'relayshield_intel_monitor.py'
      - 'relayshield_alchemy_webhook.py'
      - 'relayshield_approval_monitor.py'
      - 'relayshield_gas_monitor.py'
      - 'relayshield_liquidation_monitor.py'
      - 'relayshield_tgmonthly_digest.py'
      - 'relayshield_stablecoin_monitor.py'
      # Added 2026-08-29. These two had source in the repo, no deploy path and,
      # until 2026-08-27, no drift detection either — the exact combination that
      # produced ~1,900 undeployed lines across four handlers on 2026-08-26. The
      # 2026-08-28 drift run confirmed the drift here is one-directional: live is
      # main minus the A7 commit, with nothing live-only to recover. That means
      # the check cannot go green until a deploy path exists. It does now.
      - 'relayshield_intel_feed.py'
      - 'relayshield_intel_kev.py'
      # Shared module. relayshield_intel_feed.py imports it, so the import walk
      # maps it to relayshield-intel-feed on its own; this entry only makes a
      # change to it trigger the workflow at all.
      - 'relayshield_intel_labels.py'
      # Added 2026-09-01. Shared module, and the FIRST one imported by both bot
      # handlers: the forward-provenance core and the Quickstart card. The
      # import walk maps it to relayshield-telegram-webhook AND
      # relayshield-whatsapp-webhook on its own, so both get repackaged; this
      # entry only makes a change to it trigger the workflow at all. Without
      # it, editing only this file would change what both bots say to users and
      # deploy nothing.
      - 'relayshield_forward_analysis.py'
      # Added 2026-09-03, after its first drift diff was finally read. It had
      # been the FIFTH handler with source in the repo, live traffic, and no
      # deploy path -- so no edit to it had ever shipped automatically, and the
      # email-check footer merged on 2026-09-02 was invisible in Discord while
      # main was entirely correct.
      #
      # The diff was read before this entry was written, as the rule requires.
      # tools/discord_bot_drift.sh established the live package is BYTE-
      # IDENTICAL to this file as of 0c429e0 (live LastModified 2026-08-13),
      # missing exactly one commit: 4a688e8, the footer. Nothing live-only, so
      # nothing to recover, so a repo-sourced deploy destroys nothing.
      - 'relayshield_discord_bot.py'
      # Added 2026-09-03, AFTER its recovery was reconciled and not before.
      # This is the sixth handler that had source in the repo, live traffic and
      # no deploy path, and its first drift diff was the expensive kind: ~700
      # live-only lines including the Bundle A and Bundle D direct-Stripe
      # doors. Mapping it while that was outstanding would have deleted a
      # revenue path on the next merge, with no error anywhere.
      #
      # It is safe now because the recovery landed first, verbatim, and the
      # only thing main adds on top is three attribution registrations. Live is
      # byte-identical to the recovery commit and missing exactly the
      # registration commit, which is the ordinary stale case.
      - 'relayshield_developer_signup.py'
      # Mapped 2026-09-04 after its recovered diff was read and main was moved
      # to the live bytes verbatim. The path entry matters as much as the map
      # entry: the deployer only ships a function when the PUSH touched its
      # source, so a commit that maps a handler while editing only workflow
      # files deploys nothing at all.
      - 'relayshield_agentic_api.py'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  deploy:
    name: Deploy to AWS Lambda
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for OIDC
      contents: read

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history. Depth 2 was enough only while every push to main was a
          # single commit; the moment a merge lands, the base this job needs is
          # github.event.before, which can be any distance back.
          fetch-depth: 0

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::239677749008:role/relayshield-github-deploy
          aws-region: us-east-1
          # No access keys needed — OIDC issues a short-lived token

      - name: Detect changed Lambda files
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual trigger — deploy all mapped Lambda files
            CHANGED="relayshield_breach_monitor.py relayshield_whatsapp_webhook.py relayshield_stripe_webhook.py relayshield_domain_monitor.py relayshield_sim_swap_monitor.py relayshield_api.py relayshield_digest_sender.py relayshield_day3_sender.py relayshield_oauth_watchlist_monitor.py relayshield_monthly_oauth_reminder.py relayshield_quarterly_sweep_sender.py relayshield_telegram_webhook.py relayshield_intel_monitor.py relayshield_alchemy_webhook.py relayshield_approval_monitor.py relayshield_gas_monitor.py relayshield_liquidation_monitor.py relayshield_tgmonthly_digest.py relayshield_stablecoin_monitor.py relayshield_intel_feed.py relayshield_intel_kev.py relayshield_discord_bot.py relayshield_developer_signup.py"
            echo "Manual trigger — deploying all Lambdas"
          else
            # Push trigger — deploy every handler this PUSH changed.
            #
            # This used to diff HEAD~1..HEAD, which is wrong for a merge commit
            # and wrong in a way that fails silently. HEAD~1 on a merge is the
            # FIRST parent, so the diff shows only what the second parent
            # contributed, and every change that arrived down the first-parent
            # line looks unchanged. On 2026-08-29 that would have shipped
            # nothing for relayshield-intel-feed and relayshield-intel-kev on
            # the very merge that was meant to deploy them, and reported
            # success.
            #
            # github.event.before is where main actually pointed before this
            # push, so diffing from it covers every commit the push introduced
            # regardless of shape. Falls back to HEAD~1 when it is absent or
            # unreachable (a brand-new branch pushes the all-zero SHA).
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] \
               && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              BASE="$BEFORE"
            else
              BASE="HEAD~1"
              echo "github.event.before unusable — falling back to HEAD~1"
            fi
            echo "Diffing $BASE..HEAD"
            CHANGED=$(git diff --name-only "$BASE" HEAD | grep '^relayshield_.*\.py$' | tr '\n' ' ' | sed 's/ $//' || true)
            echo "Changed files: $CHANGED"
          fi
          echo "files=$CHANGED" >> $GITHUB_OUTPUT

      - name: Deploy changed Lambdas
        if: steps.changes.outputs.files != ''
        run: |
          # Map source file → Lambda function name
          declare -A LAMBDA_MAP=(
            ["relayshield_breach_monitor.py"]="relayshield-breach-monitor"
            ["relayshield_whatsapp_webhook.py"]="relayshield-whatsapp-webhook"
            ["relayshield_stripe_webhook.py"]="relayshield-stripe-webhook"
            ["relayshield_domain_monitor.py"]="relayshield-domain-monitor"
            ["relayshield_sim_swap_monitor.py"]="relayshield-sim-swap-monitor"
            ["relayshield_api.py"]="relayshield-api"
            ["relayshield_digest_sender.py"]="relayshield-digest-sender"
            ["relayshield_day3_sender.py"]="relayshield-day3-sender"
            ["relayshield_oauth_watchlist_monitor.py"]="relayshield-oauth-watchlist-monitor"
            ["relayshield_monthly_oauth_reminder.py"]="relayshield-monthly-oauth-reminder"
            ["relayshield_quarterly_sweep_sender.py"]="relayshield-quarterly-sweep-sender"
            ["relayshield_sms_fallback_sender.py"]="relayshield-sms-fallback-sender"
            ["relayshield_telegram_webhook.py"]="relayshield-telegram-webhook"
            ["relayshield_intel_monitor.py"]="relayshield-intel-monitor"
            ["relayshield_alchemy_webhook.py"]="relayshield-alchemy-webhook"
            ["relayshield_approval_monitor.py"]="relayshield-approval-monitor"
            ["relayshield_gas_monitor.py"]="relayshield-gas-monitor"
            ["relayshield_liquidation_monitor.py"]="relayshield-liquidation-monitor"
            ["relayshield_tgmonthly_digest.py"]="relayshield_tgmonthly_digest"
            ["relayshield_stablecoin_monitor.py"]="relayshield-stablecoin-monitor"
            ["relayshield_openapi_spec.py"]="relayshield-api"
            ["relayshield_intel_feed.py"]="relayshield-intel-feed"
            ["relayshield_intel_kev.py"]="relayshield-intel-kev"
            # Verified against AWS on 2026-09-03, not assumed: the function
            # exists under this exact name, python3.14, and the drift script
            # resolved it rather than trusting the string.
            #
            # No import-probe early return is needed here. The probe payload
            # {"source":"ci.import-probe"} falls through this handler's
            # deferred-invocation branch, finds no Discord signature headers
            # and returns 401 without doing any work -- a real response, which
            # is all the probe asserts.
            ["relayshield_discord_bot.py"]="relayshield-discord-bot"
            # Reconciled 2026-09-04, in the order the DRIFT RULE requires: the
            # live artifact was recovered onto
            # claude/recovered-live-relayshield-agentic-api, its diff read in
            # full (+22/-1, both hunks live-only: the branded API_BASE_URL and
            # the Bundle D direct-Stripe billing branch), and main was moved to
            # the live bytes VERBATIM before this line was written. main is now
            # byte-identical to what is deployed, so this deploy is a no-op that
            # proves the path rather than a change that erases 22 lines of
            # billing logic.
            ["relayshield_agentic_api.py"]="relayshield-agentic-api"
            # Name verified against AWS 2026-09-03 by tools/handler_drift.sh,
            # not assumed: python3.12, and untouched since 2026-08-17 because
            # nothing has ever deployed it automatically.
            ["relayshield_developer_signup.py"]="relayshield-developer-signup"
          )

          # Resolve a handler's local dependencies from its own imports, rather
          # than a hand-maintained list. Zipping only the handler ships a
          # package that imports a module that is not in it;
          # update-function-code still reports success, and the Lambda then dies
          # on every invocation with Runtime.ImportModuleError.
          #
          # On 2026-08-05 a single-file zip took relayshield-api down, and the
          # same push silently broke four scheduled monitors that import
          # relayshield_siem_connector. A hardcoded map fixed only the one we
          # happened to know about, which is why this walks imports instead.
          resolve_deps() {
            local seen="$1" queue="$1" cur dep
            while [ -n "$queue" ]; do
              cur="${queue%% *}"; queue="${queue#$cur}"; queue="${queue# }"
              [ -f "$cur" ] || continue
              for dep in $(grep -hoE '^[[:space:]]*(import|from) relayshield_[a-z0-9_]+' "$cur" \
                             | awk '{print $2".py"}' | sort -u); do
                case " $seen " in
                  *" $dep "*) ;;
                  *) seen="$seen $dep"; queue="$queue $dep" ;;
                esac
              done
            done
            echo "$seen"
          }

          # Select functions by DEPENDENCY, not just by handler filename. A
          # shared module like relayshield_siem_connector.py is not itself a
          # handler, but four monitors import it, and a change to it must
          # redeploy all four. Matching on handler names alone would deploy none
          # of them and leave the fleet running stale code.
          FUNCS=""
          for HANDLER in "${!LAMBDA_MAP[@]}"; do
            [ -f "$HANDLER" ] || continue
            DEPS="$(resolve_deps "$HANDLER")"
            for CHANGED in ${{ steps.changes.outputs.files }}; do
              case " $DEPS " in
                *" $CHANGED "*)
                  FUNC="${LAMBDA_MAP[$HANDLER]}"
                  case " $FUNCS " in
                    *" $FUNC "*) ;;
                    *) FUNCS="$FUNCS $FUNC"; echo "$CHANGED affects $FUNC" ;;
                  esac
                  ;;
              esac
            done
          done
          [ -n "$FUNCS" ] || echo "No changed file belongs to any mapped Lambda package"

          for FUNC in $FUNCS; do
            # Every handler that maps to this function
            PKG=""
            for FILE in "${!LAMBDA_MAP[@]}"; do
              [ "${LAMBDA_MAP[$FILE]}" = "$FUNC" ] && PKG="$PKG $FILE"
            done
            # Pull in every local relayshield_* module the handler imports,
            # transitively, so the package is complete by construction.
            PKG="$(resolve_deps "$PKG")"

            FILES=""
            for F in $PKG; do
              [ -f "$F" ] && FILES="$FILES $F"
            done

            echo "→ Packaging$FILES → $FUNC"
            rm -f deploy.zip
            zip -j deploy.zip $FILES

            # Record the package so the smoke step knows what to probe
            echo "$FUNC" >> deployed_funcs.txt

            echo "→ Deploying to $FUNC"
            # --query is not cosmetic. The default output is the function's
            # FULL configuration, environment block included, so every deploy
            # since this workflow existed has printed live secrets in plaintext
            # into a log that anyone with repo read access can fetch. Print the
            # name only; the wait below is what actually confirms the update.
            aws lambda update-function-code \
              --function-name "$FUNC" \
              --zip-file fileb://deploy.zip \
              --region us-east-1 \
              --query 'FunctionName' --output text

            # Wait for update to complete before next deploy
            aws lambda wait function-updated \
              --function-name "$FUNC" \
              --region us-east-1

            echo "✅ $FUNC deployed"
            rm -f deploy.zip
          done

      # update-function-code succeeding only means the bytes uploaded. It says
      # nothing about whether the handler can be imported. Invoke and fail the
      # run if it cannot, so a broken deploy is red instead of green.
      - name: Verify deployed Lambdas import cleanly
        if: steps.changes.outputs.files != ''
        run: |
          [ -f deployed_funcs.txt ] || { echo "nothing deployed"; exit 0; }
          FAILED=""
          while read -r FUNC || [ -n "$FUNC" ]; do
            [ -n "$FUNC" ] || continue
            echo "→ Import probe: $FUNC"

            # A deliberately unroutable payload. Every handler either ignores it
            # or returns its own error, which is fine — the only thing being
            # asserted is that the module loaded at all. An import failure shows
            # up as Runtime.ImportModuleError regardless of payload.
            #
            # relayshield_intel_feed.py and relayshield_intel_kev.py additionally
            # recognise this exact source string and return immediately, because
            # they start ingesting the moment they are invoked and a full pass
            # outruns the read timeout below.
            #
            # Delete the response file first. It used to be reused across
            # iterations, so a function whose invoke failed outright was checked
            # against the PREVIOUS function's response and reported as clean.
            rm -f out.json
            RC=0
            aws lambda invoke --function-name "$FUNC" --region us-east-1 \
              --payload '{"source":"ci.import-probe"}' \
              --cli-read-timeout 120 --cli-connect-timeout 20 \
              --cli-binary-format raw-in-base64-out out.json >invoke.log 2>&1 || RC=$?

            if [ "$RC" -ne 0 ] || [ ! -s out.json ]; then
              # Not proof of an import failure, but it is proof the probe did not
              # run, and a probe that did not run must never read as a pass.
              echo "::error::$FUNC could not be probed (aws invoke rc=$RC, response empty)"
              cat invoke.log || true
              # The commonest cause, and the one that reads as a failed deploy
              # when it is not: the code shipped fine and the deploy role simply
              # has no invoke grant on this function. The grant is an explicit
              # ARN list, so every newly mapped function hits this once.
              if grep -qi "AccessDeniedException" invoke.log; then
                echo "::error::$FUNC WAS DEPLOYED. Only the probe was denied — the deploy role has no lambda:InvokeFunction on it. Fix: python3 tools/check_deploy_invoke_policy.py --write, then sh tools/apply_deploy_invoke_policy.sh"
              fi
              FAILED="$FAILED $FUNC"
            elif grep -qi "ImportModuleError\|No module named" out.json; then
              echo "::error::$FUNC failed to import after deploy"
              cat out.json
              FAILED="$FAILED $FUNC"
            else
              echo "✅ $FUNC imports cleanly"
            fi
          done < deployed_funcs.txt

          if [ -n "$FAILED" ]; then
            echo "::error::Broken after deploy:$FAILED"
            exit 1
          fi

      - name: No Lambda changes detected
        if: steps.changes.outputs.files == ''
        run: echo "No Lambda source files changed — nothing to deploy"
