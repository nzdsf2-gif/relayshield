name: INTEL Feed Ingestion

on:
  # NO schedule here on purpose. EventBridge rule relayshield-intel-feed-daily
  # (cron 0 6 * * ? *, ENABLED) already invokes this Lambda daily at 06:00 UTC.
  # Adding a schedule back would double-ingest. Manual backup trigger only.
  workflow_dispatch:

jobs:
  ingest:
    name: Ingest ThreatFox + URLhaus IOCs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Invoke feed Lambda
        run: |
          RESULT=$(aws lambda invoke \
            --function-name relayshield-intel-feed \
            --payload '{"source": "github-actions"}' \
            --cli-binary-format raw-in-base64-out \
            /tmp/feed_response.json \
            --query 'StatusCode' \
            --output text)

          echo "HTTP Status: $RESULT"
          cat /tmp/feed_response.json | python3 -m json.tool
