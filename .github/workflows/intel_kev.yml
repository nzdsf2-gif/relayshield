name: INTEL CISA KEV Ingestion

on:
  # NO schedule here on purpose. EventBridge rule relayshield-intel-kev-daily
  # (cron 0 7 * * ? *, ENABLED) already invokes this Lambda daily at 07:00 UTC.
  # Adding a schedule back would double-ingest. Manual backup trigger only.
  workflow_dispatch:

permissions:
  id-token: write   # OIDC, no stored key
  contents: read

jobs:
  ingest:
    name: Ingest CISA Known Exploited Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::239677749008:role/relayshield-github-deploy
          aws-region: us-east-1

      - name: Invoke KEV Lambda
        run: |
          RESULT=$(aws lambda invoke \
            --function-name relayshield-intel-kev \
            --payload '{"source": "github-actions"}' \
            --cli-binary-format raw-in-base64-out \
            /tmp/kev_response.json \
            --query 'StatusCode' \
            --output text)

          echo "HTTP Status: $RESULT"
          cat /tmp/kev_response.json | python3 -m json.tool
