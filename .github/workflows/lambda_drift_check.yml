name: Lambda Drift Check

# WHY THIS EXISTS
# ---------------
# On 2026-08-20 the founder found that Telegram help shortcuts and a round of
# command merges had vanished from the live bot. Nobody removed them. They were
# written on a laptop, deployed straight to Lambda, never committed -- and a
# later repo-sourced deploy of relayshield_telegram_webhook.py replaced the
# function with the repo's copy, silently destroying them. They were not
# recoverable from git because they had never been in git.
#
# The failure was not the deploy. It was that live code and repo code could
# disagree for weeks and NOTHING ANYWHERE SAID SO. This job says so, daily.
#
# It compares each function's deployed CodeSha256 against the sha of a zip
# built the same way deploy_lambdas.yml builds one. A mismatch means live and
# main have diverged: either someone deployed by hand, or a deploy failed
# silently. Either way it is now visible within a day instead of at the next
# accidental overwrite.

on:
  schedule:
    - cron: '0 13 * * *'   # daily, 13:00 UTC
  workflow_dispatch:

jobs:
  drift:
    name: Compare deployed Lambda code against main
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::239677749008:role/relayshield-github-deploy
          aws-region: us-east-1

      - name: Compare each function
        id: compare
        run: |
          set -uo pipefail

          # handler file -> live function name. Kept in step with
          # deploy_lambdas.yml's map; intel-monitor is included here even
          # though it has no CI deploy, because a hand-deployed function is
          # exactly the one most likely to drift.
          declare -A FUNCS=(
            ["relayshield_telegram_webhook.py"]="relayshield-telegram-webhook"
            ["relayshield_whatsapp_webhook.py"]="relayshield-whatsapp-webhook"
            ["relayshield_intel_monitor.py"]="relayshield-intel-monitor"
            # Added 2026-08-27. These two were in NEITHER this map nor
            # deploy_lambdas.yml, so their source sat in the repo with no
            # automated deploy and no drift detection: the exact combination
            # that produced ~1,900 undeployed lines across four other handlers.
            # Watched here FIRST, deliberately. They are still absent from
            # deploy_lambdas.yml, because adding them there before knowing
            # whether they have drifted would redeploy over any hand-deployed
            # work in them, which is the mistake this whole exercise exists to
            # avoid. Add them to the deployer once this check reports clean.
            ["relayshield_intel_feed.py"]="relayshield-intel-feed"
            ["relayshield_intel_kev.py"]="relayshield-intel-kev"
            # Added 2026-08-29, same story a third time. TODO.md records
            # relayshield-feed-maintainer as "Live on the stream", and its
            # source has been in the repo since TAXII-PAGINATION-2, but it was
            # in neither map. Watched here only, for the same reason as the two
            # above: nobody has ever compared it against its deployed package,
            # so adding it to the deployer now could overwrite hand-deployed
            # work with no error anywhere. Read the first red diff before
            # deciding -- live-only content means recover it, main's own
            # commits in reverse means simply add it to deploy_lambdas.yml.
            ["relayshield_feed_maintainer.py"]="relayshield-feed-maintainer"
            ["relayshield_api.py"]="relayshield-api"
            ["relayshield_breach_monitor.py"]="relayshield-breach-monitor"
            # Added 2026-08-30. Source in the repo since 2026-07-07, live and
            # serving mcp-registry-risk and prompt-injection-breach, and in
            # NEITHER map until now -- the fourth instance of that combination.
            # It is the Lambda the Rain demo ran against, so it has been taking
            # real traffic the whole time it was invisible here.
            #
            # Drift check ONLY, deliberately. Per the rule this repo learned the
            # hard way: a red diff is the alarm, read it before doing anything,
            # and only add the function to deploy_lambdas.yml once the diff shows
            # live is merely stale. If live carries something main does not, that
            # is recovered first with recover_live_handler.yml. Mapping it in the
            # deployer now would risk overwriting live-only code with no error
            # anywhere, which is exactly what cost 2,583 lines on 2026-08-17.
            ["relayshield_agentic_api.py"]="relayshield-agentic-api"
          )

          DRIFTED=""
          for FILE in "${!FUNCS[@]}"; do
            FUNC="${FUNCS[$FILE]}"
            [ -f "$FILE" ] || { echo "skip $FILE (not in repo)"; continue; }

            LIVE=$(aws lambda get-function-configuration \
                     --function-name "$FUNC" --region us-east-1 \
                     --query 'CodeSha256' --output text 2>/dev/null || echo "MISSING")
            if [ "$LIVE" = "MISSING" ]; then
              echo "::warning::$FUNC not readable — check the role has lambda:GetFunctionConfiguration"
              continue
            fi

            # Deployed packages contain more than one file, so the zip sha will
            # not match in general. What we CAN compare cheaply and reliably is
            # the handler's own source, which is what actually drifts. Pull the
            # deployed package and diff the one file out of it.
            URL=$(aws lambda get-function --function-name "$FUNC" --region us-east-1 \
                    --query 'Code.Location' --output text 2>/dev/null || echo "")
            if [ -z "$URL" ]; then
              echo "::warning::could not read package URL for $FUNC"
              continue
            fi
            curl -sS -o live.zip "$URL"
            if unzip -p live.zip "$FILE" > live_handler.py 2>/dev/null && [ -s live_handler.py ]; then
              if ! diff -q "$FILE" live_handler.py >/dev/null; then
                echo "::error::DRIFT — $FUNC does not match $FILE on main"
                # 400, not 60. Raised 2026-09-02: relayshield-agentic-api's first red
      # diff was cut off at 60 lines, so there was no way to tell from the run
      # whether the two visible hunks were the whole drift or the start of it.
      # A truncated diff makes the alarm unreadable, and the rule this check
      # enforces is "read the diff before doing anything".
      diff -u "$FILE" live_handler.py | head -400 || true
                DRIFTED="$DRIFTED $FUNC"
              else
                echo "ok — $FUNC matches $FILE"
              fi
            else
              echo "::warning::$FILE not found inside $FUNC's package (different layout?)"
            fi

            # SHARED MODULES, added 2026-09-01, WARNING-ONLY on purpose.
            #
            # The diff above compares exactly one file per function: the mapped
            # handler. Every OTHER relayshield_*.py inside the deployed package
            # -- relayshield_sim_swap_consent.py, relayshield_siem_connector.py,
            # relayshield_openapi_spec.py, and now relayshield_forward_analysis.py
            # in both bot packages -- has never been compared against main by
            # anything. A hand-deploy that touched only a shared module has
            # therefore always been invisible here, which is the precise blind
            # spot the DRIFT RULE exists to close. relayshield_sim_swap_consent.py
            # is the proof it is not hypothetical: it reached production as a
            # live-only file and was recovered on 2026-08-23 by accident, not by
            # this check.
            #
            # WARNINGS, NOT ERRORS, for exactly the reason every other addition
            # to this file was watched before it was enforced: nobody has ever
            # compared these, so the first run may go red on drift that predates
            # this change and has not been read yet. Read the first diffs, act on
            # them per the rule (live-only content is RECOVERED, never
            # overwritten), and only then promote this to feed $DRIFTED.
            for MOD in $(unzip -Z1 live.zip 2>/dev/null | grep '^relayshield_.*\.py$' || true); do
              [ "$MOD" = "$FILE" ] && continue
              [ -f "$MOD" ] || { echo "::warning::$FUNC ships $MOD, which is NOT in the repo — live-only file, recover it"; continue; }
              unzip -p live.zip "$MOD" > live_mod.py 2>/dev/null || continue
              if ! diff -q "$MOD" live_mod.py >/dev/null; then
                echo "::warning::shared-module drift — $FUNC ships a $MOD that differs from main"
                diff -u "$MOD" live_mod.py | head -200 || true
              else
                echo "ok — $FUNC's $MOD matches main"
              fi
              rm -f live_mod.py
            done

            rm -f live.zip live_handler.py
          done

          echo "drifted=$DRIFTED" >> "$GITHUB_OUTPUT"
          [ -z "$DRIFTED" ] || exit 1

      - name: Open an issue on drift
        if: failure() && steps.compare.outputs.drifted != ''
        uses: actions/github-script@v7
        with:
          script: |
            const drifted = '${{ steps.compare.outputs.drifted }}'.trim();
            const title = `Lambda drift: ${drifted}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'lambda-drift',
            });
            if (existing.data.some(i => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title,
              labels: ['lambda-drift'],
              body: [
                `Live Lambda code differs from \`main\` for: **${drifted}**`,
                '',
                'One of two things happened:',
                '',
                '1. Someone deployed by hand and did not commit. **Recover the code from the',
                '   live function before anything redeploys over it** — see the run log for the',
                '   diff, and `aws lambda get-function --function-name <fn> --query Code.Location`',
                '   for the package.',
                '2. A deploy failed part-way and the function is stale.',
                '',
                'This check exists because case 1 silently destroyed the Telegram help',
                'shortcuts and command merges on 2026-08-19.',
              ].join('\n'),
            });
