name: Marketplace Change Set

# Submits a COMMITTED change set file to the AWS Marketplace Catalog API.
#
# WHY THIS IS A SECOND WORKFLOW RATHER THAN A MODE ON marketplace_dimension.yml.
# That one is pointed at Bundle D: it reads prod-kkvurtspreofy, round-trips every
# field it is not changing, and requires the product code typed by hand. All of
# that is correct for MODIFYING a published listing and none of it applies to
# CREATING one, where there is no entity to read and no id to confirm because AWS
# assigns it. Folding both into one workflow would mean a mode in which every one
# of those guards is skipped, which is the guard that gets skipped by accident.
#
# THE TOOL REFUSES to target prod-kkvurtspreofy or prod-f5qkfsxlxs4qg, so this
# workflow cannot touch a live listing whatever is typed into it.
#
# DEFAULT IS A DRY RUN. `apply` additionally needs the confirmation phrase, which
# the tool checks rather than the workflow: a guard in the thing that does the
# work survives being called from somewhere else.

on:
  workflow_dispatch:
    inputs:
      changeset:
        description: 'Path to the change set JSON, relative to the repo root'
        type: string
        default: 'aws_marketplace/bundle_b_create_entity.json'
      mode:
        description: 'dry-run (prints what would be sent) | apply (SENDS IT)'
        type: choice
        options: [dry-run, apply]
        default: dry-run
      confirm:
        description: 'For apply ONLY: type CREATE-NEW-PRODUCT'
        type: string
        default: ''
      product_id:
        description: 'Bundle B product id, for the test offer and go-public sets. Leave empty when CREATING the product.'
        type: string
        default: ''

permissions:
  id-token: write
  contents: read

jobs:
  changeset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # WHICH COMMIT AM I RUNNING? Added 2026-09-19, after the same change set
      # failed a FOURTH time because the fix for the third failure was on a
      # branch and this workflow checks out main. A dispatch always runs the
      # DEFAULT BRANCH's copy of every file it reads -- the workflow, the tool
      # AND the change set JSON -- so "Claude fixed it" and "the fix is in this
      # run" are different facts, and nothing in the output distinguished them.
      #
      # This step makes the second one readable: the commit, and the shape of
      # the document about to be sent. A five-change SaaS create is invalid;
      # thirteen is the accepted shape. Read this before pressing apply.
      - name: Which commit and which document
        run: |
          echo "commit  : $(git --no-pager log --oneline -1)"
          echo "date    : $(git --no-pager log -1 --format=%cI)"
          python3 - "${{ inputs.changeset }}" <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1]))
          changes = doc.get("ChangeSet", [])
          print(f"file    : {sys.argv[1]}")
          print(f"changes : {len(changes)}")
          for c in changes:
              print(f"          {c['ChangeType']}")
          PY

      - name: Refuse apply without the typed confirmation
        if: ${{ inputs.mode == 'apply' }}
        run: |
          if [ "${{ inputs.confirm }}" != "CREATE-NEW-PRODUCT" ]; then
            echo "::error::apply requires confirm = CREATE-NEW-PRODUCT, typed by hand."
            echo "This creates a real product in a real marketplace account."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::239677749008:role/relayshield-github-deploy
          aws-region: us-east-1

      - name: Install boto3
        run: pip install --quiet boto3

      # product_id is passed on BOTH paths so a dry run substitutes exactly what
      # an apply would send. A dry run that skips the substitution is checking a
      # different document from the one that ships, which is the whole family of
      # defect this repo keeps paying for.
      - name: Dry run
        if: ${{ inputs.mode == 'dry-run' }}
        run: |
          python3 tools/marketplace_submit_changeset.py "${{ inputs.changeset }}" \
            --product-id "${{ inputs.product_id }}"

      - name: Apply
        if: ${{ inputs.mode == 'apply' }}
        run: |
          python3 tools/marketplace_submit_changeset.py "${{ inputs.changeset }}" \
            --product-id "${{ inputs.product_id }}" \
            --apply --confirm "${{ inputs.confirm }}"
