name: Marketplace Dimension

# Reads, and optionally changes, the Bundle D AWS Marketplace listing, using the
# same OIDC role every other AWS workflow here uses.
#
# WHY THIS WORKFLOW EXISTS. On 2026-09-08 the question "can agent-bait-scan be
# added to Bundle D from the container" was answered "no, that needs a human at
# the console". That was wrong. The container has no usable AWS credentials --
# verified, STS returns InvalidClientTokenId -- but CLAUDE.md's own rule says a
# missing credential moves the check rather than cancelling it, and Actions holds
# the role. lambda_drift_check.yml and recover_live_handler.yml are the precedent.
#
# IT CARRIES THE LISTING COPY TOO, IN ONE CHANGE SET. One submission is one AWS
# review cycle. Two submissions against the same published listing is two cycles
# and a window in which the copy advertises agent-bait scanning while the rate
# card cannot bill it. aws_marketplace/bundle_d_listing_copy.json holds only the
# fields that change; the rest are round-tripped from the live capture, because
# UpdateInformation REPLACES the whole information block exactly as AddDimensions
# replaces the whole rate card.
#
# DEFAULT IS READ-ONLY, AND DELIBERATELY SO. A change set REPLACES the whole rate
# card on a published listing, and a malformed one rolled this product's prices
# back to placeholders on 2026-07-27. So `describe` is the default mode, `plan`
# prints what would be sent, and `apply` requires typing the product code by hand.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'describe (read-only) | plan (print change set) | apply (SEND IT)'
        type: choice
        options: [describe, plan, apply]
        default: describe
      confirm_entity:
        description: 'For apply ONLY: type the product entity id to confirm'
        type: string
        default: ''
      include_listing_copy:
        description: 'Also send the listing-copy change in the SAME change set'
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

jobs:
  dimension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse apply without a typed confirmation
        if: ${{ inputs.mode == 'apply' }}
        run: |
          if [ "${{ inputs.confirm_entity }}" != "prod-kkvurtspreofy" ]; then
            echo "::error::apply requires confirm_entity to be typed exactly as prod-kkvurtspreofy."
            echo "A change set replaces the whole rate card on a PUBLISHED listing."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::239677749008:role/relayshield-github-deploy
          aws-region: us-east-1

      - name: Install boto3
        run: pip install --quiet boto3

      - name: Describe the entity
        run: python3 tools/marketplace_add_dimension.py --describe --out aws_marketplace/entity_current.json

      - name: Plan
        if: ${{ inputs.mode != 'describe' }}
        run: |
          COPY=""
          if [ "${{ inputs.include_listing_copy }}" = "true" ]; then
            COPY="--with-copy"
          fi
          python3 tools/marketplace_add_dimension.py --plan \
            --from aws_marketplace/entity_current.json $COPY

      - name: Apply
        if: ${{ inputs.mode == 'apply' }}
        run: |
          COPY=""
          if [ "${{ inputs.include_listing_copy }}" = "true" ]; then
            COPY="--with-copy"
          fi
          python3 tools/marketplace_add_dimension.py --apply \
            --from aws_marketplace/entity_current.json $COPY \
            --i-have-read-the-rate-card-warning

      # The false-positive rate is the PRODUCT gate on adding the dimension, and
      # it is separate from the permission gate above. Pull the sample here so
      # the numbers and the change set come from the same run.
      - name: Pull the agent-bait scan sample
        continue-on-error: true
        run: python3 tools/agent_bait_fp_rate.py --pull --days 30 --sample 50

      - name: Upload the capture and the sample
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-entity-capture
          path: |
            aws_marketplace/entity_current.json
            aws_marketplace/agent_bait_adjudication.jsonl
          if-no-files-found: warn
