name: Read a Marketplace product (read only)

# Turning "create the product" into a click without giving the reader a way to
# read its RESULT back is half a step, and that is what was reported on
# 2026-09-18: "Running GH Action in Step 5 doesn't make it obvious" what to put
# in BUNDLE_B_PRODUCT_CODE.
#
# This workflow calls DescribeChangeSet and DescribeEntity and nothing else. It
# has no apply mode and no confirmation phrase, deliberately: a read-only
# workflow that cannot be talked into writing is the one you re-run freely while
# AWS is still APPLYING.
#
# It also prints the distinction the repo had wrong. The entity id (prod-...) is
# the Catalog API identifier and is what the test-offer and go-public change sets
# take. The PRODUCT CODE is what ResolveCustomer returns and what
# BUNDLE_B_PRODUCT_CODE needs, and they are different strings.

on:
  workflow_dispatch:
    inputs:
      change_set_id:
        description: 'ChangeSetId from the create run. Leave empty if you already have the prod- id.'
        type: string
        default: ''
      entity_id:
        description: 'prod-... entity id. Optional if change_set_id is given.'
        type: string
        default: ''
      full:
        description: 'Also print the whole entity details document'
        type: choice
        options: ['no', 'yes']
        default: 'no'

permissions:
  id-token: write
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A dispatch runs the DEFAULT BRANCH's copy of every file, so this names
      # the commit the run used. A fix on a branch is not a fix in this run.
      - name: Which commit
        run: |
          echo "commit : $(git --no-pager log --oneline -1)"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::239677749008:role/relayshield-github-deploy
          aws-region: us-east-1

      - name: Install boto3
        run: pip install --quiet boto3

      - name: Describe
        run: |
          ARGS=""
          if [ -n "${{ inputs.change_set_id }}" ]; then
            ARGS="$ARGS --change-set-id ${{ inputs.change_set_id }}"
          fi
          if [ -n "${{ inputs.entity_id }}" ]; then
            ARGS="$ARGS --entity-id ${{ inputs.entity_id }}"
          fi
          if [ "${{ inputs.full }}" = "yes" ]; then
            ARGS="$ARGS --full"
          fi
          python3 tools/marketplace_read_product.py $ARGS
