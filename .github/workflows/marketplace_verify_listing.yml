name: Marketplace Bundle D listing check (read only)

# Compares the LIVE Bundle D product and its offer with what this repo says they should say, field by
# field, and prints PASS or DIFFERS for each. It has no apply mode and cannot change anything.
#
# WHY. Changes to this listing go through the Management Portal, and a person pastes text into its
# forms. A session cannot see the clipboard, so "I gave you the text" and "the text is live" are
# different facts. This is how the second one is established. See tools/verify_bundle_d_listing.py.
#
# A dispatch runs main's copy of the tool AND of the files it compares against, so merge first.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Which stage decides pass or fail. All four are always printed.'
        type: choice
        options: [endpoint, copy, architecture, prices, all]
        default: endpoint

permissions:
  id-token: write
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Which commit
        run: |
          echo "commit : $(git --no-pager log --oneline -1)"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::239677749008:role/relayshield-github-deploy
          aws-region: us-east-1

      - name: Install boto3
        run: pip install --quiet boto3

      - name: Compare
        run: python3 tools/verify_bundle_d_listing.py --stage ${{ inputs.stage }}
