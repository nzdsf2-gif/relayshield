name: Roll Back a Lambda to a Published Version

# Added 2026-10-29 for the AWS Well-Architected review (REL 8: rollback, immutable artefacts).
#
# deploy_lambdas.yml publishes an immutable version after every deploy that passes the import probe, and
# moves the 'live' alias to it. This workflow puts a previous version's CODE back on the function, proves it
# imports, and moves 'live' to match.
#
# WHAT IT RESTORES: the code package only. Environment variables, timeout, memory and the role are left as
# they are today, because they are not what a bad deploy changes and a rollback should not silently undo a
# secret rotation.
#
# WHY IT RESTORES CODE AND DOES NOT JUST MOVE THE ALIAS: API Gateway still invokes the unqualified
# function, so moving an alias alone would change nothing a customer sees. See the note in
# deploy_lambdas.yml. This is the rollback that works today.
#
# Dispatch from the Actions UI (workflow dispatch is a 403 for Claude).

on:
  workflow_dispatch:
    inputs:
      function:
        description: Function to roll back
        type: choice
        required: true
        options:
          - relayshield-api
          - relayshield-bundle-fulfillment
          - relayshield-stripe-webhook
          - relayshield-mcp-http
      version:
        description: "'previous' (the version before the one the live alias points at) or a version number from the list printed by the first step"
        required: true
        default: previous

jobs:
  rollback:
    name: Restore a published version
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC
      contents: read
    env:
      FUNC: ${{ inputs.function }}
      WANT: ${{ inputs.version }}
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::239677749008:role/relayshield-github-deploy
          aws-region: us-east-1

      - name: Show the published versions
        run: |
          aws lambda list-versions-by-function --function-name "$FUNC" --region us-east-1 \
            --query 'Versions[].[Version,LastModified,Description]' --output table
          echo "live alias currently points at:"
          aws lambda get-alias --function-name "$FUNC" --name live --region us-east-1 \
            --query FunctionVersion --output text

      - name: Work out the target version
        id: target
        run: |
          [[ "$WANT" =~ ^(previous|[0-9]+)$ ]] || { echo "::error::version must be 'previous' or a number, got: $WANT"; exit 1; }
          CUR=$(aws lambda get-alias --function-name "$FUNC" --name live --region us-east-1 \
                  --query FunctionVersion --output text)
          ALL=$(aws lambda list-versions-by-function --function-name "$FUNC" --region us-east-1 \
                  --query 'Versions[].Version' --output text | tr '\t' '\n' | grep -v LATEST | sort -n)
          if [ "$WANT" = "previous" ]; then
            TARGET=$(echo "$ALL" | awk -v c="$CUR" '$1 < c' | tail -1)
            [ -n "$TARGET" ] || { echo "::error::no published version older than $CUR exists"; exit 1; }
          else
            TARGET="$WANT"
            echo "$ALL" | grep -qx "$TARGET" || { echo "::error::version $TARGET is not a published version of $FUNC"; exit 1; }
          fi
          echo "Rolling $FUNC back from live=$CUR to version $TARGET"
          echo "version=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Restore that version's code
        env:
          TARGET: ${{ steps.target.outputs.version }}
        run: |
          URL=$(aws lambda get-function --function-name "$FUNC" --qualifier "$TARGET" --region us-east-1 \
                  --query Code.Location --output text)
          curl -fsSL "$URL" -o rollback.zip
          aws lambda update-function-code --function-name "$FUNC" --zip-file fileb://rollback.zip \
            --region us-east-1 --query FunctionName --output text
          aws lambda wait function-updated --function-name "$FUNC" --region us-east-1

      - name: Prove it imports
        run: |
          rm -f out.json
          aws lambda invoke --function-name "$FUNC" --region us-east-1 \
            --payload '{"source":"ci.import-probe"}' --cli-binary-format raw-in-base64-out \
            --cli-read-timeout 120 --cli-connect-timeout 20 out.json >invoke.log 2>&1 \
            || { echo "::error::probe could not run"; cat invoke.log; exit 1; }
          if grep -qiE '"errorType": *"Runtime\.[A-Za-z]+"|ImportModuleError|UserCodeSyntaxError|No module named' out.json; then
            echo "::error::$FUNC does not import after rollback"; cat out.json; exit 1
          fi
          echo "✅ $FUNC imports cleanly"

      - name: Move the live alias to match
        env:
          TARGET: ${{ steps.target.outputs.version }}
        run: |
          aws lambda update-alias --function-name "$FUNC" --name live --function-version "$TARGET" --region us-east-1 \
            --query FunctionVersion --output text
          echo "### $FUNC rolled back to version $TARGET" >> "$GITHUB_STEP_SUMMARY"
