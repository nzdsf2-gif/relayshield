name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-audit:
    name: Run Security Checks
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history required by gitleaks for historical secret scanning

      # -----------------------------------------------------------------------
      # 2. Python setup
      # -----------------------------------------------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -----------------------------------------------------------------------
      # 3. Install security tools
      # -----------------------------------------------------------------------
      - name: Install security tools
        run: |
          pip install bandit pip-audit

      # -----------------------------------------------------------------------
      # 4. Bandit — static analysis for Python security issues
      #    -ll = report only MEDIUM and HIGH severity issues (fails on HIGH)
      #    -r  = recursive; targets all .py files in the repo root
      # -----------------------------------------------------------------------
      - name: Run Bandit (static analysis)
        run: |
          bandit -r . \
            --exclude ./.github,./node_modules \
            --severity-level high \
            --confidence-level medium \
            -f txt \
            -o bandit-report.txt || true

          # Re-run with exit-code so the step fails on HIGH severity findings
          bandit -r . \
            --exclude ./.github,./node_modules \
            --severity-level high \
            --confidence-level medium \
            -q

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.txt

      # -----------------------------------------------------------------------
      # 5. pip-audit — check requirements.txt against known CVE database
      #    PyPA-maintained replacement for safety, no auth or policy file needed
      # -----------------------------------------------------------------------
      - name: Run pip-audit (dependency CVE check)
        run: |
          pip-audit -r requirements.txt

      # -----------------------------------------------------------------------
      # 6. Gitleaks — secret scanning (open source, no API key required)
      #    Scans full git history for accidentally committed secrets.
      #    Uses GITHUB_TOKEN which is automatically available in all workflows.
      # -----------------------------------------------------------------------
      - name: Run gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # 7. Guard: new TelegramClient(StringSession(...)) construction must go
      #    through the shared relayshield_intel_monitor_lock singleton.
      #
      #    2026-07-23 and 2026-08-24: two separate incidents where a second
      #    code path built its own TelegramClient from the same
      #    relayshield/telethon_session StringSession, concurrently with an
      #    already-running one. Two live sessions on two IPs is exactly what
      #    triggers Telegram's AuthKeyDuplicatedError and revokes the session
      #    outright -- each incident needed an interactive re-login through a
      #    human's phone to recover, which is why this is a build-time check
      #    and not just a comment: the failure mode is expensive enough (see
      #    2026-08-24's session state) that it should not depend on the next
      #    person noticing the two already-locked files before adding a third.
      #
      #    The two production files below already share one LOCK_ID
      #    ("singleton") in relayshield_intel_monitor_lock, acquired before
      #    any Telegram work and released in a finally block -- see the
      #    comment on LOCK_ID in relayshield_intel_monitor.py for the pattern
      #    to copy. The other two are one-time local scripts a human runs by
      #    hand, never automated infra that can overlap a scheduled run.
      # -----------------------------------------------------------------------
      - name: Guard against unlocked Telegram sessions
        run: |
          ALLOWED="relayshield_intel_monitor.py relayshield_intel_discovery.py intel_setup_telethon.py regenerate_telethon_session.py"
          OFFENDERS=""
          for f in $(grep -rl "StringSession(" --include="*.py" . 2>/dev/null | sed 's|^\./||'); do
            case " $ALLOWED " in
              *" $f "*) ;;
              *) OFFENDERS="$OFFENDERS $f" ;;
            esac
          done
          if [ -n "$OFFENDERS" ]; then
            echo "::error::New file(s) construct a TelegramClient(StringSession(...)) without going through the shared relayshield_intel_monitor_lock: $OFFENDERS"
            echo "This is exactly the bug behind the 2026-07-23 and 2026-08-24 AuthKeyDuplicatedError incidents -- a second code path opening the same Telegram session concurrently with relayshield-intel-monitor or relayshield-intel-discovery gets it revoked again."
            echo "Either route this through the same lock (LOCK_ID = \"singleton\" in relayshield_intel_monitor_lock, see relayshield_intel_monitor.py), or add the file to ALLOWED in this workflow step with a comment explaining why it cannot overlap the other two."
            exit 1
          fi
          echo "OK: no new unlocked TelegramClient(StringSession(...)) construction found."
