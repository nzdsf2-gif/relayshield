name: Tests

# Added 2026-10-27 for the AWS Well-Architected review (OPS, REL 8): until now 104 test files
# existed and nothing ran them. This job runs all of them and fails on any NEW failure.
# 13 files already failed when it was written; they are listed in tests_known_failing.txt and
# the list may only shrink. See tools/run_test_suite.py for the rule.
#
# No AWS credentials and no secrets: the suites stub every external call, and this job must
# never be able to reach production. permissions is read-only on purpose.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Run test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # The baseline in tests_known_failing.txt was measured on 3.13.
          python-version: '3.13'

      - name: Install test dependencies
        run: python -m pip install -r tests_requirements.txt

      - name: Run every test_*.py
        run: python tools/run_test_suite.py
