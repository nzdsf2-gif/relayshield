<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:640px; height:360px; overflow:hidden; }
  body {
    /* --tg-theme-bg-color default from cloudflare_worker_miniapp.js */
    background:
      radial-gradient(900px 380px at 78% -12%, rgba(59,130,246,.20), transparent 62%),
      radial-gradient(600px 300px at 8% 112%, rgba(34,197,94,.10), transparent 60%),
      #17212b;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color:#f5f5f5;
    display:flex; align-items:center; gap:34px;
    padding:0 52px;
  }
  .shield { flex:0 0 auto; }
  .type { display:flex; flex-direction:column; gap:11px; }
  .brand { font-size:20px; letter-spacing:.30em; text-transform:uppercase;
           color:#94a3b8; font-weight:600; }
  .name  { font-size:71px; line-height:.96; font-weight:800; letter-spacing:-.026em; }
  .name .id { color:#3b82f6; }
  .rule  { width:74px; height:4px; border-radius:2px; background:#3b82f6; margin:3px 0 1px; }
  .tag   { font-size:22px; line-height:1.35; color:#cbd5e1; font-weight:400; max-width:330px; }
</style></head><body>

  <svg class="shield" width="150" height="176" viewBox="0 0 150 176" fill="none">
    <defs>
      <linearGradient id="g" x1="12" y1="6" x2="140" y2="170" gradientUnits="userSpaceOnUse">
        <stop stop-color="#60a5fa"/><stop offset="1" stop-color="#2563eb"/>
      </linearGradient>
    </defs>
    <path d="M75 5 L140 30 V88 C140 128 110 158 75 171 C40 158 10 128 10 88 V30 Z"
          fill="url(#g)" fill-opacity="0.16" stroke="url(#g)" stroke-width="6"
          stroke-linejoin="round"/>
    <circle cx="66" cy="80" r="26" fill="none" stroke="#f5f5f5" stroke-width="9"/>
    <line x1="85" y1="99" x2="109" y2="124" stroke="#f5f5f5" stroke-width="11"
          stroke-linecap="round"/>
  </svg>

  <div class="type">
    <div class="brand">RelayShield</div>
    <div class="name">ID<span class="id">Check</span></div>
    <div class="rule"></div>
    <div class="tag">Check a link or a wallet<br>address before you trust it.</div>
  </div>

</body></html>
