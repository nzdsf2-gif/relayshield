<!doctype html>
<!-- THE BOT'S ICON, AND IT IS NOT THE MINI APP'S.
     idcheck_icon_512.png names IDCheck, which is the Mini App. tg.app lists the
     BOT separately, under the RelayShield name, doing breach and SIM-swap
     monitoring -- so an icon reading "IDCheck" on that card names a different
     product from the one the card is for. Same shield, same two Telegram theme
     colours, different wordmark: one brand, two surfaces, each labelled as
     itself. -->
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:512px; height:512px; overflow:hidden; }
  body {
    /* Same two colours as idcheck_botfather_640x360.html, and for the same
       reason: --tg-theme-bg-color and --tg-theme-button-color defaults from
       cloudflare_worker_miniapp.js, so the catalogue tile and the app a user
       opens are one colour scheme rather than two guesses. */
    background:
      radial-gradient(560px 400px at 76% -10%, rgba(59,130,246,.26), transparent 62%),
      radial-gradient(460px 320px at 6% 110%, rgba(34,197,94,.11), transparent 60%),
      #17212b;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color:#f5f5f5;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:30px;
  }
  /* No tagline and no eyebrow ON PURPOSE. A catalogue renders this at roughly
     80-120px in a grid, where a 22px line becomes a grey smudge. The shield has
     to carry it alone at that size, and the wordmark is what survives next. */
  /* 56px, not the IDCheck tile's 86px: "RelayShield" is eleven characters
     against seven, so the same size overflows 512px. Measured by rendering,
     not estimated -- build_icon_512.sh asserts the wordmark fits. */
  .name  { font-size:56px; line-height:.92; font-weight:800; letter-spacing:-.028em; }
  .name .id { color:#3b82f6; }
  .rule  { width:92px; height:5px; border-radius:3px; background:#3b82f6; }
</style></head><body>

  <svg width="236" height="277" viewBox="0 0 150 176" fill="none">
    <defs>
      <linearGradient id="g" x1="12" y1="6" x2="140" y2="170" gradientUnits="userSpaceOnUse">
        <stop stop-color="#60a5fa"/><stop offset="1" stop-color="#2563eb"/>
      </linearGradient>
    </defs>
    <path d="M75 5 L140 30 V88 C140 128 110 158 75 171 C40 158 10 128 10 88 V30 Z"
          fill="url(#g)" fill-opacity="0.16" stroke="url(#g)" stroke-width="6"
          stroke-linejoin="round"/>
    <circle cx="66" cy="80" r="26" fill="none" stroke="#f5f5f5" stroke-width="9"/>
    <line x1="85" y1="99" x2="109" y2="124" stroke="#f5f5f5" stroke-width="11"
          stroke-linecap="round"/>
  </svg>

  <div class="name">Relay<span class="id">Shield</span></div>
  <div class="rule"></div>

</body></html>
