<!doctype html>
<!-- A TOOLBAR ACTION icon, not the brand hero mark relayshield_icon_512.html
     renders. That one is built for a large tile with a dark backdrop behind
     it: the shield fill is deliberately low-opacity (0.16) because the
     colour comes from the page behind it, not the shape itself. Shrunk to
     16-48px on a browser toolbar, that low-opacity fill and thin gradient
     stroke lose almost all contrast, and a solid dark background square (the
     literal bug reported) reads as a muted blob next to every other
     extension's bold, transparent-background icon.

     A toolbar icon needs the opposite properties: a TRANSPARENT background
     (works on Chrome's light AND dark toolbar chrome) and a bold, solid-fill
     silhouette that stays legible at 16px, which is exactly what Chrome's
     own icon guidelines ask for. -->
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; }
  html, body { width:128px; height:128px; background:transparent; }
  body { display:flex; align-items:center; justify-content:center; }
</style></head><body>
  <svg width="112" height="112" viewBox="0 0 150 176" fill="none">
    <defs>
      <linearGradient id="g" x1="12" y1="6" x2="140" y2="170" gradientUnits="userSpaceOnUse">
        <stop stop-color="#60a5fa"/><stop offset="1" stop-color="#2563eb"/>
      </linearGradient>
    </defs>
    <!-- Solid fill, not 0.16 -- this is the entire fix. Same shield outline
         as the brand mark, filled all the way rather than left for a
         backdrop to show through. -->
    <path d="M75 5 L140 30 V88 C140 128 110 158 75 171 C40 158 10 128 10 88 V30 Z"
          fill="url(#g)" stroke="#f5f5f5" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="66" cy="80" r="26" fill="none" stroke="#f5f5f5" stroke-width="11"/>
    <line x1="85" y1="99" x2="109" y2="124" stroke="#f5f5f5" stroke-width="13"
          stroke-linecap="round"/>
  </svg>
</body></html>
