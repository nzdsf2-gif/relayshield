<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #17212b;
    --panel: #1e2a35;
    --text: #f5f5f5;
    --muted: #9aa7b0;
    --accent: #3b82f6;
    --high: #ef4444;
    --medium: #f59e0b;
    --low: #22c55e;
    --unknown: #9aa7b0;
  }
  * { box-sizing: border-box; }
  body {
    width: 340px;
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  h1 {
    font-size: 15px;
    font-weight: 700;
    margin: 0 0 4px;
  }
  h1 .id { color: var(--accent); }
  p.sub {
    font-size: 12px;
    color: var(--muted);
    margin: 0 0 12px;
  }
  textarea, input[type="text"] {
    width: 100%;
    background: var(--panel);
    border: 1px solid #2a3a47;
    border-radius: 8px;
    color: var(--text);
    padding: 8px 10px;
    font-size: 13px;
    font-family: inherit;
    margin-bottom: 8px;
  }
  textarea { height: 56px; resize: none; }
  textarea:focus, input:focus { outline: 1px solid var(--accent); }
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 10px;
    background: var(--panel);
    border-radius: 8px;
    padding: 3px;
  }
  .tab {
    flex: 1;
    padding: 6px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .tab.active { background: var(--accent); color: #fff; }
  .panel { display: none; }
  .panel.active { display: block; }
  button.action {
    width: 100%;
    margin-top: 2px;
    padding: 9px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }
  button.action:disabled { opacity: .6; cursor: default; }
  #result {
    margin-top: 12px;
    padding: 10px;
    border-radius: 8px;
    background: var(--panel);
    display: none;
    font-size: 13px;
  }
  #result.show { display: block; }
  #result .level {
    font-weight: 700;
    margin-bottom: 6px;
  }
  #result .level.high { color: var(--high); }
  #result .level.medium { color: var(--medium); }
  #result .level.low { color: var(--low); }
  #result .level.unknown { color: var(--unknown); }
  #result ul { margin: 0; padding-left: 18px; color: var(--muted); }
  #result .note { color: var(--muted); font-size: 11px; margin-top: 8px; }
  #result button.share {
    margin-top: 10px;
    width: 100%;
    padding: 7px;
    border: 1px solid #2a3a47;
    border-radius: 6px;
    background: transparent;
    color: var(--text);
    font-size: 12px;
    cursor: pointer;
  }
  #result button.share:hover { background: #24323e; }
  #error {
    margin-top: 10px;
    font-size: 12px;
    color: var(--high);
    display: none;
  }
  #error.show { display: block; }
  footer {
    margin-top: 14px;
    padding-top: 10px;
    border-top: 1px solid #2a3a47;
    font-size: 11px;
    color: var(--muted);
    text-align: center;
  }
  footer a { color: var(--accent); text-decoration: none; }
  footer p { margin: 0 0 6px; }
  footer p:last-child { margin-bottom: 0; }
  footer button.link-like {
    background: none;
    border: none;
    padding: 0;
    font: inherit;
    color: var(--accent);
    cursor: pointer;
  }
</style>
</head>
<body>
  <h1>Relay<span class="id">Shield</span></h1>
  <p class="sub">No signup, no key. Never says "safe" — only what's known.</p>

  <div class="tabs">
    <button class="tab active" id="tab-link" data-tab="link">Link / Wallet</button>
    <button class="tab" id="tab-email" data-tab="email">Email</button>
  </div>

  <div class="panel active" id="panel-link">
    <textarea id="input" placeholder="https://... or a wallet address"></textarea>
    <button class="action" id="check">Check</button>
  </div>

  <div class="panel" id="panel-email">
    <input type="text" id="email-from" placeholder="Sender address (optional)">
    <input type="text" id="email-subject" placeholder="Subject (optional)">
    <textarea id="email-body" placeholder="Paste the email body"></textarea>
    <button class="action" id="check-email">Check email</button>
  </div>

  <div id="result"></div>
  <div id="error"></div>

  <footer>
    <p>Breach and infostealer checks need a free key —
      <a id="apikey" href="#" target="_blank" rel="noopener">get one</a>
    </p>
    <p>Same check on your phone —
      <a href="https://t.me/relayshield_bot/idcheck?startapp=tg-miniapp-chromeext"
         target="_blank" rel="noopener">Telegram Mini App</a>
    </p>
    <p>Want ongoing breach and SIM-swap monitoring, not just one-off checks? —
      <a href="https://t.me/relayshield_bot?start=SRC_chromeext" target="_blank" rel="noopener">Telegram</a>
      ·
      <a href="https://wa.me/17407373961?text=SRC_chromeext" target="_blank" rel="noopener">WhatsApp</a>
    </p>
    <p>Know someone who'd use this? —
      <button class="link-like" id="share-generic">Copy a link to send them</button>
    </p>
  </footer>

  <script src="api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
