# Copy this to the ROOT of the MCP server's own repository (~/mcp-live), not here.
#
# =============================================================================
# REWRITTEN 2026-09-09. IT NOW DESCRIBES THE HOSTED SERVER, AND THE CLI READS
# ALMOST NONE OF THIS FILE.
# =============================================================================
#
# Two separate corrections, and the second one is the surprise.
#
# 1. IT POINTS AT THE HOSTED HF SPACE NOW, NOT THE PyPI STDIO PACKAGE.
#    The 2026-09-05 version was checked on 2026-09-09 and was `type: stdio`
#    running `uvx --from relayshield-mcp`. That was a correct description of the
#    WRONG SERVER for this purpose. stdio and hosted-HTTP are two different
#    listings for two different visitors: a stdio entry tells someone to install
#    a Python package, a hosted entry hands them a URL that works from a browser
#    with nothing installed. FD-15 is the decision to have ONE hosted URL, and
#    this is it.
#
# 2. THE MODERN CLI READS EXACTLY TWO KEYS OUT OF THIS FILE: `name` and
#    `target`. Read from @smithery/cli 4.11.1 on npm rather than from memory or
#    from a docs page (smithery.ai is egress-blocked from the container; the npm
#    registry is not -- the "THE BLOCKED SOURCE WAS REACHABLE ALL ALONG" rule).
#    Its parser is, literally:
#
#        z.object({ name: z.string().optional(),
#                   target: z.enum(["local", "remote"]).optional() }).loose()
#
#    `.loose()` is why everything else below is harmless: unknown keys are kept,
#    not rejected. The elaborate `startCommand` / `configSchema` / `tools` block
#    the previous two versions of this file argued about is the LEGACY v1 schema,
#    from when Smithery scanned a GitHub repo and built the server itself. It is
#    not read by the CLI that publishes today. So the file is documentation for
#    US, and two lines of configuration for the CLI.
#
# HOW A HOSTED SERVER IS ACTUALLY PUBLISHED, from the CLI's own README:
#
#     smithery auth login
#     smithery mcp publish https://relayshieldadmin-relayshield-agentic-attack-surface.hf.space/gradio_api/mcp/sse -n relayshield/relayshield
#
#   The auth step is not optional and is not "you logged in last time" -- tokens
#   expire, and omitting the login step is exactly what cost a round on
#   mcp-publisher. The cost of a redundant login is three seconds.
#
# THE URL IS WATCHED. `tools/check_hf_space.py` probes this exact path on both
# Spaces every six hours from .github/workflows/hf_space_watch.yml and opens an
# issue when it stops streaming. Publishing a URL that nothing watches is the
# quiet-alarm failure with an audience, and test_miniapp.py's sibling check pins
# the URL in this file against the one the watcher probes, because two files that
# must agree with nothing checking them is the shape this repo keeps paying for.

name: relayshield
target: remote

# --- Everything below is documentation. The CLI keeps it and ignores it. ------

displayName: RelayShield
description: >-
  Screen what an agent is about to trust. Breach, SIM-swap, infostealer,
  domain-lookalike, OAuth-watchlist and MCP-registry-risk checks, plus prompt
  injection, tech-stack CVE and agent-bait scanning, against
  identity-compromise and criminal-source threat intelligence.
homepage: https://api.relayshield.net/developers?source=mcp-registry
license: MIT

# The SAME URL the AWS Marketplace entity registers as Bundle D's EndpointUrl
# (ApiType: MCP_SERVER), on the PUBLIC Space rather than the -aws one. The -aws
# Space runs the same code with AWS_MARKETPLACE_MODE=true, which scrubs every
# reference to the self-serve signup page because AWS's Tier-1 audit treats a
# reachable link to an external payment page as a violation. A Smithery visitor
# is not an AWS buyer and should see the signup page, so they get the public one.
remote:
  url: https://relayshieldadmin-relayshield-agentic-attack-surface.hf.space/gradio_api/mcp/sse
  transport: sse

# Keyless by design. The server answers without a key and returns its payment
# requirements, which is a usable discovery mode rather than an error. A listing
# that demands a key before the first call blocks every trial, which is the whole
# point of being in a directory.
configSchema:
  type: object
  properties:
    relayshieldApiKey:
      type: string
      title: RelayShield API key (optional)
      description: >-
        Optional. Free tier at api.relayshield.net/developers. Without it the
        server still answers and returns pricing.
