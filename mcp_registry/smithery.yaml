# Copy this to the ROOT of the MCP server's own repository (~/mcp-live), not here.
#
# =============================================================================
# REPOINTED 2026-09-26. IT NOW TARGETS THE DEDICATED FREE/KEYLESS SPACE, NOT
# THE BUNDLE D AGENTIC-ATTACK-SURFACE SPACE.
# =============================================================================
#
# Bundle D's Space answers a keyless call with pricing, not a verdict --
# correct for a paid product, wrong for the first thing a Smithery browser
# tries. relayshieldadmin/relayshield-free-mcp is a SEPARATE Space built for
# exactly this: check_link, check_wallet and check_email are genuinely
# keyless (a real answer, not a price), check_breach needs a key and says so
# rather than failing silently. That is the self-serve first use a directory
# listing needs, and it is the same artefact FD-14 (OpenAI) needs too -- one
# hosted URL for both, per FD-15.
#
# ALSO NEW: THIS SERVER SPEAKS STREAMABLE HTTP, NOT GRADIO'S SSE MOUNT. The
# Bundle D Space is a Gradio app with mcp_server=True, mounted at
# /gradio_api/mcp/sse. This one exposes a plain /mcp endpoint over the MCP
# spec's Streamable HTTP transport (POST, not a long-lived GET stream) --
# different framework, different path, different check. tools/check_hf_space.py
# has a SEPARATE probe function for it; do not reuse the Gradio one.
#
# =============================================================================
# REWRITTEN 2026-09-09 (kept below). IT DESCRIBES A HOSTED SERVER, AND THE CLI
# READS ALMOST NONE OF THIS FILE.
# =============================================================================
#
# Two separate corrections, and the second one is the surprise.
#
# 1. IT POINTS AT THE HOSTED HF SPACE NOW, NOT THE PyPI STDIO PACKAGE.
#    The 2026-09-05 version was checked on 2026-09-09 and was `type: stdio`
#    running `uvx --from relayshield-mcp`. That was a correct description of the
#    WRONG SERVER for this purpose. stdio and hosted-HTTP are two different
#    listings for two different visitors: a stdio entry tells someone to install
#    a Python package, a hosted entry hands them a URL that works from a browser
#    with nothing installed. FD-15 is the decision to have ONE hosted URL, and
#    this is it.
#
# 2. THE MODERN CLI READS EXACTLY TWO KEYS OUT OF THIS FILE: `name` and
#    `target`. Read from @smithery/cli 4.11.1 on npm rather than from memory or
#    from a docs page (smithery.ai is egress-blocked from the container; the npm
#    registry is not -- the "THE BLOCKED SOURCE WAS REACHABLE ALL ALONG" rule).
#    Its parser is, literally:
#
#        z.object({ name: z.string().optional(),
#                   target: z.enum(["local", "remote"]).optional() }).loose()
#
#    `.loose()` is why everything else below is harmless: unknown keys are kept,
#    not rejected. The elaborate `startCommand` / `configSchema` / `tools` block
#    the previous two versions of this file argued about is the LEGACY v1 schema,
#    from when Smithery scanned a GitHub repo and built the server itself. It is
#    not read by the CLI that publishes today. So the file is documentation for
#    US, and two lines of configuration for the CLI.
#
# HOW A HOSTED SERVER IS ACTUALLY PUBLISHED, from the CLI's own README:
#
#     smithery auth login
#     smithery mcp publish https://relayshieldadmin-relayshield-free-mcp.hf.space/mcp -n relayshield/relayshield
#
#   The auth step is not optional and is not "you logged in last time" -- tokens
#   expire, and omitting the login step is exactly what cost a round on
#   mcp-publisher. The cost of a redundant login is three seconds.
#
# THE URL IS WATCHED, and this one is NEW as of 2026-09-26 -- verify it fires
# before trusting it on a schedule. `tools/check_hf_space.py --only free-mcp`
# probes this exact URL with a real MCP `initialize` request; run it once from
# somewhere that can reach hf.space (this repo's own container cannot) before
# it goes into `.github/workflows/hf_space_watch.yml`'s unattended run.
# Publishing a URL that nothing watches is the quiet-alarm failure with an
# audience, and test_hosted_mcp_pointer.py pins the URL in this file against
# the one the watcher probes, because two files that must agree with nothing
# checking them is the shape this repo keeps paying for.

name: relayshield
target: remote

# --- Everything below is documentation. The CLI keeps it and ignores it. ------

displayName: RelayShield
description: >-
  Free, keyless checks for a link, a crypto wallet address, or a suspicious
  email's signals -- before an agent or a person trusts any of them. Breach
  lookup available with a free API key.
homepage: https://api.relayshield.net/developers?source=mcp-registry
license: MIT

# A DIFFERENT Space from Bundle D's agentic-attack-surface, deliberately.
# That Space answers a keyless call with a price, not a verdict -- correct for
# a paid product, wrong for the first thing a directory visitor tries. This
# Space's check_link/check_wallet/check_email tools are genuinely keyless,
# which is the self-serve first use a listing needs. It also speaks the MCP
# spec's Streamable HTTP transport (POST to /mcp), not Gradio's SSE mount --
# see tools/check_hf_space.py's check_streamable() for why that needs its own
# probe rather than reusing the Gradio one.
remote:
  url: https://relayshieldadmin-relayshield-free-mcp.hf.space/mcp
  transport: streamable-http

# Keyless by design for three of the four tools. check_breach needs a key and
# returns setup instructions rather than failing silently without one -- a
# listing that demands a key before the FIRST call blocks every trial, which
# is the whole point of being in a directory.
configSchema:
  type: object
  properties:
    relayshieldApiKey:
      type: string
      title: RelayShield API key (optional)
      description: >-
        Optional, only needed for check_breach. Free tier at
        api.relayshield.net/developers. The other three tools work with no key
        at all.
