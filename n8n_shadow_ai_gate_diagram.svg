<rect x="-765" y="389" width="560" height="862" rx="12" fill="#fffdf0" stroke="#f0c419" stroke-width="2"/>
<text x="-739.0" y="423.0" font-size="21" font-weight="700" fill="#3e2723">Shadow AI &amp; Vendor Approval Gate with RelayShield</text>
<text x="-739.0" y="477.0" font-size="16" font-weight="700" fill="#5d4037">How it works</text>
<text x="-723.0" y="501.0" font-size="13" fill="#5d4037">Runs when a new SaaS vendor or AI-tool request is submitted</text>
<text x="-723.0" y="521.0" font-size="13" fill="#5d4037">(form or ITSM ticket) via this workflow&#x27;s webhook. Branches on</text>
<text x="-723.0" y="541.0" font-size="13" fill="#5d4037">request_type: a plain SaaS request runs three checks (supply</text>
<text x="-723.0" y="561.0" font-size="13" fill="#5d4037">chain risk, public-repo secret exposure, OAuth/token exposure).</text>
<text x="-723.0" y="581.0" font-size="13" fill="#5d4037">An AI-tool request runs those plus mcp-registry-risk — typosquat</text>
<text x="-723.0" y="601.0" font-size="13" fill="#5d4037">domains, known-malicious IOCs, newly-registered MCP server</text>
<text x="-723.0" y="621.0" font-size="13" fill="#5d4037">domains. Either path alerts Slack, logs to Notion, and emails</text>
<text x="-723.0" y="641.0" font-size="13" fill="#5d4037">the requester an approve/pending-review outcome. Clean results</text>
<text x="-723.0" y="661.0" font-size="13" fill="#5d4037">are logged too, so every request is auditable.</text>
<text x="-739.0" y="699.0" font-size="16" font-weight="700" fill="#5d4037">Setup steps</text>
<circle cx="-735.0" cy="719.0" r="2.6" fill="#a1887f"/>
<text x="-723.0" y="723.0" font-size="13" fill="#5d4037">Point your intake form or ITSM system at this workflow&#x27;s</text>
<text x="-723.0" y="743.0" font-size="13" fill="#5d4037">webhook, posting { request_type: &quot;saas&quot;|&quot;ai_tool&quot;,</text>
<text x="-723.0" y="763.0" font-size="13" fill="#5d4037">requester_name, requester_email, department, vendor_name,</text>
<text x="-723.0" y="783.0" font-size="13" fill="#5d4037">vendor_domain, server_url } (server_url/package_name only for</text>
<text x="-723.0" y="803.0" font-size="13" fill="#5d4037">ai_tool)</text>
<circle cx="-735.0" cy="819.0" r="2.6" fill="#a1887f"/>
<text x="-723.0" y="823.0" font-size="13" fill="#5d4037">Add your RelayShield API credential to the 4 custom RelayShield</text>
<text x="-723.0" y="843.0" font-size="13" fill="#5d4037">nodes. The Secret Scan and MCP Registry Risk checks use HTTP</text>
<text x="-723.0" y="863.0" font-size="13" fill="#5d4037">Request nodes with a Header Auth credential instead (header</text>
<text x="-723.0" y="883.0" font-size="13" fill="#5d4037">X-RS-API-KEY, value = your API key) — those two operations</text>
<text x="-723.0" y="903.0" font-size="13" fill="#5d4037">aren&#x27;t in the community node&#x27;s operation list yet</text>
<circle cx="-735.0" cy="919.0" r="2.6" fill="#a1887f"/>
<text x="-723.0" y="923.0" font-size="13" fill="#5d4037">Set notionVendorGateDbId and slackSecurityChannelId in your n8n</text>
<text x="-723.0" y="943.0" font-size="13" fill="#5d4037">variables</text>
<circle cx="-735.0" cy="959.0" r="2.6" fill="#a1887f"/>
<text x="-723.0" y="963.0" font-size="13" fill="#5d4037">Connect and authorize the Gmail and Slack credentials</text>
<text x="-739.0" y="1001.0" font-size="16" font-weight="700" fill="#5d4037">Why the OAuth check runs against the requester, not the vendor</text>
<text x="-723.0" y="1025.0" font-size="13" fill="#5d4037">It checks the requesting employee&#x27;s email, not the vendor&#x27;s —</text>
<text x="-723.0" y="1045.0" font-size="13" fill="#5d4037">the real question at approval time is whether the person about</text>
<text x="-723.0" y="1065.0" font-size="13" fill="#5d4037">to grant this tool OAuth access already shows signs of</text>
<text x="-723.0" y="1085.0" font-size="13" fill="#5d4037">compromised credentials. That&#x27;s the person whose authority the</text>
<text x="-723.0" y="1105.0" font-size="13" fill="#5d4037">integration would inherit.</text>
<text x="-739.0" y="1143.0" font-size="16" font-weight="700" fill="#5d4037">Customization</text>
<text x="-723.0" y="1167.0" font-size="13" fill="#5d4037">Add more RelayShield checks (ransomware risk, identity graph) to</text>
<text x="-723.0" y="1187.0" font-size="13" fill="#5d4037">broaden coverage, or adjust alert routing to match your</text>
<text x="-723.0" y="1207.0" font-size="13" fill="#5d4037">escalation process.</text>
