[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "relayshield-precommit"
version = "0.1.0"
description = "Pre-commit hook that blocks commits introducing API keys, tokens and other machine credentials"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "RelayShield", email = "support@relayshield.net" }]
keywords = ["pre-commit", "secrets", "security", "secret-scanning", "credentials", "devsecops"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
# No third-party dependencies on purpose: this runs in pre-commit's isolated
# virtualenv on every commit, and each dependency is install latency the user
# pays for and supply-chain surface in a security tool.
dependencies = []

[project.urls]
Homepage = "https://api.relayshield.net/developers"
Documentation = "https://api.relayshield.net/developers"

[project.scripts]
relayshield-secret-scan = "relayshield_precommit.scan:main"

[tool.setuptools]
packages = ["relayshield_precommit"]
