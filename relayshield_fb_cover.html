<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 820px; height: 312px; overflow: hidden; background: #0b1622; font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; }

  .cover { width: 820px; height: 312px; position: relative; background: #0b1622; overflow: hidden; }

  .grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgba(0,210,255,0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(0,210,255,0.035) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  .glow {
    position: absolute; width: 500px; height: 500px; top: -150px; left: 200px;
    background: radial-gradient(ellipse, rgba(100,60,255,0.10) 0%, transparent 65%);
  }
  .glow2 {
    position: absolute; width: 400px; height: 400px; top: -100px; right: 50px;
    background: radial-gradient(ellipse, rgba(0,200,255,0.07) 0%, transparent 65%);
  }

  .accent-line { position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, #7c5cfc 25%, #00d4ff 60%, transparent); }
  .bottom-line { position: absolute; bottom: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(124,92,252,0.4) 30%, rgba(0,212,255,0.4) 60%, transparent); }

  /* LEFT: Shield + wordmark */
  .brand {
    position: absolute;
    top: 50%; left: 44px;
    transform: translateY(-50%);
    display: flex; align-items: center; gap: 14px;
  }

  .shield-wrap {
    width: 72px; height: 72px; border-radius: 16px; overflow: hidden;
    flex-shrink: 0;
    box-shadow: 0 0 24px rgba(124,92,252,0.4);
  }
  .shield-wrap img { width: 100%; height: 100%; object-fit: cover; }

  .brand-text { display: flex; flex-direction: column; gap: 3px; }
  .brand-name {
    font-size: 22px; font-weight: 800; color: #ffffff;
    letter-spacing: -0.01em; line-height: 1;
  }
  .brand-name span { color: #7c5cfc; }
  .brand-sub {
    font-size: 11px; color: rgba(255,255,255,0.4);
    letter-spacing: 0.14em; text-transform: uppercase;
    font-weight: 500;
  }

  /* Vertical divider */
  .divider {
    position: absolute;
    left: 256px; top: 40px; bottom: 40px;
    width: 1px;
    background: linear-gradient(180deg, transparent, rgba(0,212,255,0.25) 30%, rgba(0,212,255,0.25) 70%, transparent);
  }

  /* RIGHT: Main message */
  .message {
    position: absolute;
    top: 50%; right: 0; left: 282px;
    transform: translateY(-50%);
    padding-right: 40px;
  }

  .tagline {
    font-size: 26px; font-weight: 700; color: #ffffff;
    letter-spacing: -0.02em; line-height: 1.2;
    margin-bottom: 12px;
    text-wrap: pretty;
  }
  .tagline .highlight { color: #00d4ff; }

  .pillars {
    font-size: 11.5px; font-weight: 500;
    color: rgba(255,255,255,0.45);
    letter-spacing: 0.2em; text-transform: uppercase;
    margin-bottom: 12px;
  }
  .pillars .dot { color: #7c5cfc; margin: 0 5px; opacity: 0.8; }

  .delivery {
    font-size: 12.5px; color: rgba(255,255,255,0.35);
    letter-spacing: 0.03em;
  }
  .delivery strong { color: rgba(255,255,255,0.6); font-weight: 600; }

  .website {
    position: absolute; bottom: 18px; right: 28px;
    font-size: 11px; color: rgba(255,255,255,0.22); letter-spacing: 0.1em;
  }
</style>
</head>
