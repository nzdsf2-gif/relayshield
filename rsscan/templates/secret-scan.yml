# GitLab CI/CD Catalog component.
#
# Usage in .gitlab-ci.yml:
#
#   include:
#     - component: $CI_SERVER_FQDN/relayshield/rsscan/secret-scan@0.1.0
#       inputs:
#         fail_on: HIGH
#
# Set RELAYSHIELD_API_KEY as a masked CI/CD variable.

spec:
  inputs:
    stage:
      default: test
      description: Pipeline stage for the scan job.
    fail_on:
      default: HIGH
      options: [LOW, MEDIUM, HIGH, CRITICAL]
      description: Lowest severity that fails the pipeline.
    allowlist:
      default: .relayshield-allowlist
      description: Path to a fingerprint allowlist file.
    strict:
      default: 'true'
      options: ['true', 'false']
      description: >-
        Fail the pipeline if the scan itself cannot run. Defaults true: a gate
        that silently reports success when it could not run is worse than none.
    image:
      default: python:3.12-alpine
      description: Image to run in.
---

rsscan:
  stage: $[[ inputs.stage ]]
  image: $[[ inputs.image ]]
  variables:
    # GitLab shallow-clones by default, so the merge base is usually absent and
    # the diff would silently resolve to nothing. Full history is required for
    # the range to mean anything.
    GIT_DEPTH: 0
    RSSCAN_FAIL_ON: $[[ inputs.fail_on ]]
    RSSCAN_ALLOWLIST: $[[ inputs.allowlist ]]
    RSSCAN_STRICT: $[[ inputs.strict ]]
  before_script:
    - apk add --no-cache git >/dev/null 2>&1 || true
    - pip install --quiet --disable-pip-version-check rsscan==0.1.0
  script:
    - |
      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ]; then
        RANGE="$CI_MERGE_REQUEST_DIFF_BASE_SHA...$CI_COMMIT_SHA"
      elif [ -n "$CI_COMMIT_BEFORE_SHA" ] && [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
        RANGE="$CI_COMMIT_BEFORE_SHA..$CI_COMMIT_SHA"
      else
        # New branch: no before-SHA. Scanning all history would fail every first
        # pipeline on any repo with legacy findings.
        RANGE="$CI_COMMIT_SHA~1..$CI_COMMIT_SHA"
      fi
      echo "Scanning $RANGE"
      RSSCAN_REV_RANGE="$RANGE" rsscan
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH
