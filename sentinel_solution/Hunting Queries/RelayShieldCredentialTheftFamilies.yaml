id: ba5351a3-32e1-44da-87f8-c2f0f267454f
name: RelayShield - Credential theft family infrastructure contacted
description: |
  'Hunts for contact with RelayShield indicators attributed to credential-stealing malware families,
  rather than to any family. Scoped this way because a stealer hit has a specific and urgent follow-up
  that a generic indicator match does not: the credentials on that host should be treated as exposed and
  rotated, regardless of whether the payload ever executed successfully.'
description-detailed: |
  'RelayShield attributes indicators to malware families observed in criminal marketplaces, where stolen
  credential logs are the traded commodity. Filtering the feed to the stealer families turns an indicator
  match into an actionable question about which accounts to rotate.
  Written as a hunt rather than a detection on purpose. Family attribution is a strong prioritisation
  signal but not proof of execution, and infrastructure is reused and re-sold across campaigns, so the
  output needs an analyst rather than an automatic incident. Family labels are folded and comma-split
  before matching, because exact matching silently under-counts.'
requiredDataConnectors:
  - connectorId: ThreatIntelligenceTaxii
    dataTypes:
      - ThreatIntelIndicators
  - connectorId: CEF
    dataTypes:
      - CommonSecurityLog
tactics:
  - CredentialAccess
  - Collection
query: |
  let starttime = todatetime('{{StartTimeISO}}');
  let endtime = todatetime('{{EndTimeISO}}');
  let ioc_lookBack = 14d;
  // Families whose primary product is stolen credentials. Extend this list as the
  // prevalence hunting query surfaces new ones.
  let stealer_families = dynamic([
    "vidar", "redline", "raccoon", "stealc", "lumma", "lummac2", "agenttesla",
    "formbook", "remcosrat", "remcos", "azorult", "mars", "rhadamanthys",
    "risepro", "metastealer", "atomic", "amos", "clearfake", "efimer"
  ]);
  let Stealer_Indicators = materialize(
      ThreatIntelIndicators
      | where TimeGenerated >= ago(ioc_lookBack)
      | where SourceSystem has "RelayShield" or tostring(Data.external_references) has "relayshield"
      // Measured 2026-08-16: restricting this to IP and domain dropped vidar (46
      // indicators) and agenttesla (21) to zero and cut remcosrat from 19 to 1, over a
      // window that was WIDER, not narrower. So the key filter is what removed them.
      // url:value is included on the assumption they are URL indicators; if the pending
      // ObservableKey-by-family breakdown shows file hashes instead, this needs a
      // DeviceFileEvents or SecurityEvent branch rather than a URL one.
      | where ObservableKey in ("ipv4-addr:value", "domain-name:value", "url:value")
      | summarize arg_max(TimeGenerated, *) by Id
      | where IsActive and (isnull(ValidUntil) or ValidUntil > now())
      | mv-expand Label = Data.labels
      | where tostring(Label) startswith "malware:"
      | extend Family = tolower(replace_string(tostring(Label), "malware:", ""))
      | mv-expand Family = split(Family, ",")
      | extend Family = trim(" ", tostring(Family))
      | where Family in (stealer_families)
      | project IndicatorId = Id, IndicatorValue = tolower(ObservableValue), Family,
                Confidence, ValidUntil, ThreatDescription = tostring(Data.description)
  );
  let Traffic = materialize(
      CommonSecurityLog
      | where TimeGenerated between (starttime .. endtime)
      | extend RequestUrl = tostring(column_ifexists("RequestURL", ""))
      | extend DestinationHost = tolower(tostring(column_ifexists("DestinationHostName", "")))
      | extend UrlHost = tolower(tostring(parse_url(RequestUrl).Host))
      | extend Traffic_TimeGenerated = TimeGenerated
  );
  let TrafficKeys = union
      (Traffic | where isnotempty(DestinationIP)   | extend MatchKey = tolower(DestinationIP)),
      (Traffic | where isnotempty(DestinationHost) | extend MatchKey = DestinationHost),
      (Traffic | where isnotempty(UrlHost)         | extend MatchKey = UrlHost),
      // Full-URL branch, for url:value indicators. The host-only branch above still
      // catches the case where the indicator is the bare domain.
      (Traffic | where isnotempty(RequestUrl)      | extend MatchKey = tolower(RequestUrl));
  Stealer_Indicators
  | join kind=innerunique (TrafficKeys) on $left.IndicatorValue == $right.MatchKey
  | where isnull(ValidUntil) or Traffic_TimeGenerated < ValidUntil
  | summarize
      Contacts    = count(),
      FirstSeen   = min(Traffic_TimeGenerated),
      LastSeen    = max(Traffic_TimeGenerated),
      MatchedIOCs = make_set(IndicatorValue, 10),
      Confidence  = max(Confidence)
      by SourceIP, DeviceName, Family
  | extend IOCList = strcat_array(MatchedIOCs, ", ")
  | extend timestamp = LastSeen
  | order by LastSeen desc
  | project timestamp, FirstSeen, LastSeen, SourceIP, DeviceName, Family, Contacts, IOCList, Confidence
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: SourceIP
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: DeviceName
  - entityType: Malware
    fieldMappings:
      - identifier: Name
        columnName: Family
version: 1.0.0
