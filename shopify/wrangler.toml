name = "relayshield-order-screening"
main = "worker.js"
compatibility_date = "2026-01-01"

# Workers KV namespace for per-shop OAuth tokens, screening records,
# and per-shop RelayShield key assignments. Create with:
#   wrangler kv:namespace create RS_KV
# then paste the id below.
[[kv_namespaces]]
binding = "RS_KV"
id = "PASTE_KV_NAMESPACE_ID_HERE"

[vars]
# APP_URL is the worker's public URL, used as the OAuth redirect origin
# and the webhook address base. Set after first deploy:
#   wrangler deploy, then set APP_URL to the workers.dev URL (or custom domain).
APP_URL = "https://relayshield-shopify-app.YOUR_SUBDOMAIN.workers.dev"

# Secrets (never commit values). Set with:
#   wrangler secret put SHOPIFY_API_KEY
#   wrangler secret put SHOPIFY_API_SECRET
