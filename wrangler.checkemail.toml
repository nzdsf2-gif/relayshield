name = "relayshield-checkemail"
main = "cloudflare_worker_checkemail.js"
compatibility_date = "2026-09-01"

# The Worker has a fetch handler serving GET /health, so it needs its
# workers.dev subdomain. This is the default, but it is stated explicitly
# because it is load-bearing: without it there is no way to tell a Worker that
# failed to deploy from one that deployed and is silently dropping mail. After
# deploy, open in a browser:
#
#   https://relayshield-checkemail.<your-subdomain>.workers.dev/health
#
# It returns which bindings are present -- never their values -- so it is safe
# to leave public. The email path itself is unaffected by it.
workers_dev = true

# NO npm dependencies and NO node_modules: the Worker imports only
# "cloudflare:email" from the runtime itself. Nothing to install before deploy.

# ---------------------------------------------------------------------------
# RATE LIMITING. ENABLED 2026-09-02.
#
# This was commented out for the first deploy, because a binding naming a
# namespace id that does not exist makes `wrangler deploy` fail outright, and
# requiring it up front turned a working Worker into a blocked one. The code
# fails OPEN without it -- rateLimited() returns false when the binding is
# absent -- so scanning worked from the first deploy and this was switched on
# afterwards.
#
# The namespace `checkemail-rl` was created in the dashboard under
# Storage & Databases -> KV. Not Workers & Pages: KV used to live there, and an
# instruction pointing there cost a round trip. `wrangler kv namespace create`
# is not an option either -- it needs a token carrying "Workers KV Storage:
# Edit", which the deploy token does not have.
#
# Verify after deploy: GET /health reports CHECKEMAIL_RL: true.
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "CHECKEMAIL_RL"
id = "6fa845aba9e94df5854d64bdc668aafa"

# CHECKEMAIL_UNLIMITED is an optional SECRET: a comma-separated list of
# addresses exempt from the free-tier rate limit, for testing and for anyone we
# have a reason to exempt.
#   npx wrangler secret put CHECKEMAIL_UNLIMITED --config wrangler.checkemail.toml
# Absent means nobody is exempt, which is the correct default.

# RS_API_KEY is a SECRET and is deliberately not in this file:
#   npx wrangler secret put RS_API_KEY --config wrangler.checkemail.toml
# Without it the Worker still runs and still does the header analysis, which is
# the stronger half. Link checks degrade to "unknown" rather than silently
# reading as clean.
