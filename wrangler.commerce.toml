name = "relayshield-commerce"
main = "cloudflare_worker_commerce.js"
compatibility_date = "2024-01-01"

# Serves the commerce protection landing page at commerce.relayshield.net.
# Uses custom_domain so wrangler creates the DNS record automatically.
# api.relayshield.net points directly to API Gateway (not Cloudflare-proxied),
# so a path route there cannot trigger a Worker. A dedicated subdomain is the
# clean solution.

routes = [
  { pattern = "commerce.relayshield.net", custom_domain = true }
]
