name = "relayshield-commerce"
main = "cloudflare_worker_commerce.js"
compatibility_date = "2024-01-01"

# Serves the commerce protection landing page at api.relayshield.net/commerce.
# This uses a path route on the existing api.relayshield.net hostname.
# Requires api.relayshield.net to be Cloudflare-proxied (orange cloud) for the
# Worker route to intercept. If the hostname points directly at API Gateway
# without Cloudflare proxying, this route will not trigger and you'll need to
# either proxy the hostname through Cloudflare or use a dedicated subdomain
# like commerce.relayshield.net instead.

routes = [
  { pattern = "api.relayshield.net/commerce*", zone_name = "relayshield.net" }
]
